name: Publish site

# Builds the registry, installer and offline bundles and publishes them to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # full history: the registry build records the last commit that touched each package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Registry signing key
        env:
          TSR_SIGNING_KEY: ${{ secrets.TSR_SIGNING_KEY }}
        run: |
          if [ -n "$TSR_SIGNING_KEY" ]; then
            umask 077
            printf '%s' "$TSR_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
            echo "TSR_SIGNING_KEY_FILE=$RUNNER_TEMP/signing.key" >> "$GITHUB_ENV"
          else
            echo "::warning::no TSR_SIGNING_KEY secret: the published registry will NOT be signed"
          fi
      - name: Build registry and installer
        run: node tools/build/build.mjs
      - name: Build offline bundles
        run: |
          node tools/build/bundle.mjs --name full
          node tools/build/bundle.mjs --name starter core crypto pkg installer ui-tui
          mkdir -p dist/site/bundles
          cp dist/bundles/* dist/site/bundles/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
