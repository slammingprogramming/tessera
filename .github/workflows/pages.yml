name: Publish site

# Builds the registry, installer and offline bundles and publishes them to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build registry and installer
        run: node tools/build/build.mjs
      - name: Build offline bundles
        run: |
          node tools/build/bundle.mjs --name full
          node tools/build/bundle.mjs --name starter core pkg installer ui-tui
          mkdir -p dist/site/bundles
          cp dist/bundles/* dist/site/bundles/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
